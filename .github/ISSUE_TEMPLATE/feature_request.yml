name: Feature request
description: Propose a product improvement for Grok Desk
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer the product form when you can: [grokdesk.app/feedback](https://grokdesk.app/feedback).
        Use this issue for technical / repo-tracked requests.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What friction are you hitting today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Grok Desk do instead?
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks my main workflow
        - Nice-to-have
        - Exploration / edge case
    validations:
      required: true
